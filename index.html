<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Auth Codes ML</title>
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Auth ML">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            min-height: 100vh; min-height: 100dvh;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; min-height: 100dvh;
            padding: 20px 16px;
            padding-top: calc(20px + var(--safe-top));
            padding-bottom: calc(20px + var(--safe-bottom));
            gap: 16px;
        }

        h1 {
            font-size: 18px;
            font-weight: 900;
            text-align: center;
            letter-spacing: -0.5px;
        }
        h1 span { color: #FFE600; }

        /* Code cards */
        .code-card {
            width: 100%;
            max-width: 400px;
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 20px;
            padding: 24px 20px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: all 0.15s;
        }
        .code-card:active { transform: scale(0.98); background: #1a1a2a; }
        .code-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
        }
        .code-card.mikra::before { background: linear-gradient(90deg, #9C27B0, #E040FB); }
        .code-card.chaya::before { background: linear-gradient(90deg, #FF6B00, #FFB74D); }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .code-label {
            font-size: 14px;
            font-weight: 700;
        }
        .code-card.mikra .code-label { color: #E040FB; }
        .code-card.chaya .code-label { color: #FFB74D; }

        .code-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #444;
        }

        .code-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 44px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 6px;
            text-align: center;
            padding: 8px 0;
            word-break: break-all;
        }

        .code-hint {
            text-align: center;
            font-size: 10px;
            color: #333;
        }

        /* Expired / outdated */
        .code-card.expired {
            opacity: 0.4;
            border-color: #ff525244;
        }
        .code-card.expired .code-value {
            color: #ff5252;
            text-decoration: line-through;
            text-decoration-color: #ff525266;
        }

        .expired-badge {
            display: none;
            text-align: center;
            font-size: 11px;
            color: #ff5252;
            font-weight: 600;
            margin-top: 4px;
        }
        .code-card.expired .expired-badge { display: block; }

        /* Missing */
        .code-value.missing {
            font-size: 16px;
            color: #ff5252;
            letter-spacing: 0;
        }

        /* Status */
        .status-msg {
            text-align: center;
            font-size: 12px;
            min-height: 18px;
        }
        .status-msg.ok { color: #00e676; }
        .status-msg.loading { color: #888; }
        .status-msg.error { color: #ff5252; }
        .status-msg.warn { color: #FFE600; }

        /* Reload */
        .reload-btn {
            background: none;
            border: 1px solid #222;
            color: #666;
            padding: 10px 24px;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s;
        }
        .reload-btn:active { border-color: #FFE600; color: #FFE600; }
        .reload-btn:disabled { opacity: 0.3; }

        /* Toast */
        .toast {
            position: fixed;
            top: calc(14px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: #00a650;
            color: white;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes flash-copy {
            0% { background: #12121a; }
            50% { background: #1a2a1a; border-color: #00e676; }
            100% { background: #12121a; border-color: #1e1e2e; }
        }
        .flash { animation: flash-copy 0.5s ease; }
    </style>
</head>
<body>
    <div class="app">
        <h1>🔑 <span>Auth Codes</span></h1>

        <div class="status-msg loading" id="status">Cargando...</div>

        <div class="code-card mikra" id="cardMikra" onclick="copiar('mikra')">
            <div class="code-header">
                <div class="code-label">MIKRA</div>
                <div class="code-time" id="timeMikra"></div>
            </div>
            <div class="code-value" id="codeMikra">---</div>
            <div class="expired-badge">⚠️ CÓDIGO DE OTRO DÍA — Abrí ML para actualizar</div>
            <div class="code-hint">tocar = copiar</div>
        </div>

        <div class="code-card chaya" id="cardChaya" onclick="copiar('chaya')">
            <div class="code-header">
                <div class="code-label">CHAYA</div>
                <div class="code-time" id="timeChaya"></div>
            </div>
            <div class="code-value" id="codeChaya">---</div>
            <div class="expired-badge">⚠️ CÓDIGO DE OTRO DÍA — Abrí ML para actualizar</div>
            <div class="code-hint">tocar = copiar</div>
        </div>

        <button class="reload-btn" id="reloadBtn" onclick="cargar()">⟳ Actualizar</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const WORKER_URL = 'https://ml-auth-codes.rafaelassir.workers.dev';
        let codes = { mikra: null, chaya: null };

        function hoyArgentina() {
            return new Date().toLocaleDateString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires' });
        }

        function esDeHoy(updated) {
            if (!updated) return false;
            const fechaCodigo = new Date(updated).toLocaleDateString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires' });
            return fechaCodigo === hoyArgentina();
        }

        async function cargar() {
            const btn = document.getElementById('reloadBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.className = 'status-msg loading';
            status.textContent = 'Cargando...';

            try {
                const resp = await fetch(`${WORKER_URL}/get-all`);
                const data = await resp.json();
                codes = data;

                let mikraOk = false, chayaOk = false;

                // MIKRA
                const cardM = document.getElementById('cardMikra');
                if (data.mikra?.code) {
                    document.getElementById('codeMikra').textContent = data.mikra.code;
                    document.getElementById('codeMikra').className = 'code-value';
                    document.getElementById('timeMikra').textContent = formatTime(data.mikra.updated);
                    if (esDeHoy(data.mikra.updated)) {
                        cardM.classList.remove('expired');
                        mikraOk = true;
                    } else {
                        cardM.classList.add('expired');
                    }
                } else {
                    document.getElementById('codeMikra').textContent = 'Sin código';
                    document.getElementById('codeMikra').className = 'code-value missing';
                    cardM.classList.add('expired');
                }

                // CHAYA
                const cardC = document.getElementById('cardChaya');
                if (data.chaya?.code) {
                    document.getElementById('codeChaya').textContent = data.chaya.code;
                    document.getElementById('codeChaya').className = 'code-value';
                    document.getElementById('timeChaya').textContent = formatTime(data.chaya.updated);
                    if (esDeHoy(data.chaya.updated)) {
                        cardC.classList.remove('expired');
                        chayaOk = true;
                    } else {
                        cardC.classList.add('expired');
                    }
                } else {
                    document.getElementById('codeChaya').textContent = 'Sin código';
                    document.getElementById('codeChaya').className = 'code-value missing';
                    cardC.classList.add('expired');
                }

                // Auto-copy solo los de hoy: Chaya primero, Mikra último
                let copied = null;
                try {
                    if (chayaOk) {
                        await navigator.clipboard.writeText(data.chaya.code);
                        flashCard('cardChaya');
                        copied = 'chaya';
                    }
                    if (mikraOk) {
                        await new Promise(r => setTimeout(r, 300));
                        await navigator.clipboard.writeText(data.mikra.code);
                        flashCard('cardMikra');
                        copied = 'mikra';
                    }
                } catch(e) {}

                // Status
                if (mikraOk && chayaOk) {
                    status.className = 'status-msg ok';
                    status.textContent = '✅ Códigos de hoy — MIKRA en portapapeles';
                } else if (mikraOk || chayaOk) {
                    status.className = 'status-msg warn';
                    const cual = !mikraOk ? 'MIKRA' : 'CHAYA';
                    status.textContent = `⚠️ ${cual} desactualizado — Abrí ML en esa cuenta`;
                } else {
                    status.className = 'status-msg error';
                    status.textContent = '❌ Códigos vencidos — Abrí ML en ambas cuentas';
                }

                if (copied) showToast(`📋 ${copied.toUpperCase()} copiado`);

            } catch (e) {
                status.className = 'status-msg error';
                status.textContent = '❌ Error de conexión';
            }

            btn.disabled = false;
        }

        async function copiar(cuenta) {
            const data = codes[cuenta];
            if (!data?.code) return;

            if (!esDeHoy(data.updated)) {
                showToast('⚠️ Código viejo — No copiado');
                return;
            }

            try {
                await navigator.clipboard.writeText(data.code);
                flashCard(cuenta === 'mikra' ? 'cardMikra' : 'cardChaya');
                showToast(`📋 ${cuenta.toUpperCase()}: ${data.code}`);
            } catch(e) {
                // Fallback
                const ta = document.createElement('textarea');
                ta.value = data.code;
                ta.style.cssText = 'position:fixed;opacity:0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                flashCard(cuenta === 'mikra' ? 'cardMikra' : 'cardChaya');
                showToast(`📋 ${cuenta.toUpperCase()}: ${data.code}`);
            }
        }

        function flashCard(id) {
            const el = document.getElementById(id);
            el.classList.remove('flash');
            void el.offsetWidth;
            el.classList.add('flash');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const now = new Date();
            const min = Math.floor((now - d) / 60000);
            if (min < 1) return 'recién';
            if (min < 60) return `hace ${min}min`;
            const h = Math.floor(min / 60);
            if (h < 24) return `hace ${h}h`;
            return d.toLocaleDateString('es-AR');
        }

        // Init
        cargar();
        setInterval(cargar, 5 * 60 * 1000);

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
</body>
</html>
