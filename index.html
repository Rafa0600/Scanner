<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>QR Scanner - Auth Codes</title>
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QR Auth">
    <link rel="manifest" href="manifest-qr.json">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 16px; }

        h1 { font-size: 20px; font-weight: 900; text-align: center; margin-bottom: 16px; letter-spacing: -0.5px; }
        h1 span { color: #FFE600; }

        /* Auth codes display */
        .codes-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .code-card {
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .code-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }
        .code-card.mikra::before { background: linear-gradient(90deg, #9C27B0, #E040FB); }
        .code-card.chaya::before { background: linear-gradient(90deg, #FF6B00, #FFB74D); }

        .code-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .code-card.mikra .code-label { color: #E040FB; }
        .code-card.chaya .code-label { color: #FFB74D; }

        .code-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
        }

        .code-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: #444;
            margin-top: 4px;
        }

        .code-missing {
            font-size: 12px;
            color: #ff5252;
        }

        /* Scanner */
        .scanner-section {
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .qr-frame {
            position: relative;
            width: 100%;
            background: #000;
            line-height: 0;
        }
        #qr-video {
            width: 100%;
            max-height: 65vh;
            object-fit: cover;
            display: block;
            background: #000;
        }
        /* Guía estática (sin animaciones que consuman) */
        .qr-frame::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 62%;
            aspect-ratio: 1;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(255, 230, 0, 0.85);
            border-radius: 18px;
            box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }

        .scan-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3483FA, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .scan-btn:hover { transform: scale(1.02); }
        .scan-btn.active { background: linear-gradient(135deg, #ff5252, #d32f2f); }

        /* Selección de cuenta tras escanear */
        .account-ask {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #e8e8f0;
        }
        .account-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 16px 18px;
            margin-bottom: 10px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            transition: transform 0.1s;
        }
        .account-btn:active { transform: scale(0.97); }
        .account-btn.mikra { background: linear-gradient(135deg, #9C27B0, #E040FB); }
        .account-btn.chaya { background: linear-gradient(135deg, #FF6B00, #FFB74D); }
        .account-btn .account-name { font-size: 16px; font-weight: 800; letter-spacing: 1px; }
        .account-btn .account-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .account-hint { font-size: 11px; color: #888; margin-top: 6px; }

        /* Result */
        .result-card {
            background: #12121a;
            border: 2px solid #1e1e2e;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 12px;
            transition: all 0.3s;
        }
        .result-card.match {
            border-color: #00e676;
            background: #0a1a0f;
        }
        .result-card.no-match {
            border-color: #ff5252;
            background: #1a0a0a;
        }

        .result-icon { font-size: 48px; margin-bottom: 8px; }

        .result-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .result-card.match .result-code { color: #00e676; }
        .result-card.no-match .result-code { color: #ff5252; }

        .result-detail {
            font-size: 13px;
            color: #888;
        }
        .result-card.match .result-detail { color: #66bb6a; }
        .result-card.no-match .result-detail { color: #ef9a9a; }

        .result-cuenta {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 8px;
        }
        .result-cuenta.mikra { background: #9C27B0; color: white; }
        .result-cuenta.chaya { background: #FF6B00; color: white; }

        /* History */
        .history-title {
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 10px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .history-item.match { border-left: 3px solid #00e676; }
        .history-item.no-match { border-left: 3px solid #ff5252; }

        .history-code {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }
        .history-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #555;
        }

        .reload-codes {
            background: none;
            border: 1px solid #333;
            color: #888;
            padding: 6px 14px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reload-codes:hover { border-color: #FFE600; color: #FFE600; }

        @keyframes flash-green {
            0%, 100% { background: #0a1a0f; }
            50% { background: #1a3a1f; }
        }
        @keyframes flash-red {
            0%, 100% { background: #1a0a0a; }
            50% { background: #3a1a1a; }
        }
        .flash-ok { animation: flash-green 0.3s ease 3; }
        .flash-fail { animation: flash-red 0.3s ease 3; }

        /* Sound feedback hidden elements */
        .beep-ok, .beep-fail { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 <span>QR Scanner</span></h1>

        <div class="codes-row">
            <div class="code-card mikra">
                <div class="code-label">MIKRA</div>
                <div class="code-value" id="codeMikra">---</div>
                <div class="code-time" id="timeMikra"></div>
            </div>
            <div class="code-card chaya">
                <div class="code-label">CHAYA</div>
                <div class="code-value" id="codeChaya">---</div>
                <div class="code-time" id="timeChaya"></div>
            </div>
        </div>

        <div style="text-align:center; margin-bottom:12px;">
            <button class="reload-codes" onclick="cargarCodigos()">⟳ Actualizar códigos</button>
        </div>

        <button class="scan-btn" id="scanBtn" onclick="toggleScanner()">📷 Escanear QR</button>

        <div class="scanner-section" id="scannerSection" style="display:none;">
            <div class="qr-frame">
                <video id="qr-video" playsinline muted autoplay></video>
            </div>
            <canvas id="qr-canvas" hidden></canvas>
            <button class="scan-btn" id="torchBtn" style="display:none; margin:8px; width:calc(100% - 16px);" onclick="toggleTorch()">🔦 Linterna</button>
        </div>

        <div id="resultArea"></div>

        <div id="historyArea"></div>
    </div>

    <script>
        const WORKER_URL = 'https://ml-auth-codes.rafaelassir.workers.dev';

        let authCodes = { mikra: null, chaya: null };
        let scanning = false;
        let scanHistory = [];
        let lastScannedCode = '';
        let lastScanTime = 0;

        // Escáner nativo
        let currentStream = null;
        let currentTrack = null;
        let detector = null;
        let torchOn = false;

        // Cargar códigos del worker
        async function cargarCodigos() {
            try {
                const resp = await fetch(`${WORKER_URL}/get-all`);
                const data = await resp.json();
                authCodes = data;

                // Mikra
                if (data.mikra?.code) {
                    document.getElementById('codeMikra').textContent = data.mikra.code;
                    document.getElementById('timeMikra').textContent = formatTime(data.mikra.updated);
                } else {
                    document.getElementById('codeMikra').innerHTML = '<span class="code-missing">Sin código</span>';
                    document.getElementById('timeMikra').textContent = '';
                }

                // Chaya
                if (data.chaya?.code) {
                    document.getElementById('codeChaya').textContent = data.chaya.code;
                    document.getElementById('timeChaya').textContent = formatTime(data.chaya.updated);
                } else {
                    document.getElementById('codeChaya').innerHTML = '<span class="code-missing">Sin código</span>';
                    document.getElementById('timeChaya').textContent = '';
                }
            } catch (e) {
                console.error('Error cargando códigos:', e);
                document.getElementById('codeMikra').innerHTML = '<span class="code-missing">Error</span>';
                document.getElementById('codeChaya').innerHTML = '<span class="code-missing">Error</span>';
            }
        }

        function formatTime(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            const now = new Date();
            const diffMin = Math.floor((now - d) / 60000);
            if (diffMin < 1) return 'recién';
            if (diffMin < 60) return `hace ${diffMin}min`;
            const diffH = Math.floor(diffMin / 60);
            if (diffH < 24) return `hace ${diffH}h`;
            return d.toLocaleDateString('es-AR');
        }

        // Scanner
        async function toggleScanner() {
            const btn = document.getElementById('scanBtn');
            const section = document.getElementById('scannerSection');

            if (scanning) {
                stopScanner();
                btn.textContent = '📷 Escanear QR';
                btn.classList.remove('active');
                section.style.display = 'none';
            } else {
                section.style.display = 'block';
                btn.textContent = '⏹ Detener';
                btn.classList.add('active');
                startScanner();
            }
        }

        async function startScanner() {
            const video = document.getElementById('qr-video');

            // 1) Abrir la cámara trasera. 1280x720 es el punto justo: nítido para leer
            //    el QR y liviano para que no lagee. Enfoque continuo para que no salga borroso.
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
            } catch (err) {
                console.error('Error accediendo a la cámara:', err);
                document.getElementById('resultArea').innerHTML = `
                    <div class="result-card no-match">
                        <div class="result-icon">📵</div>
                        <div class="result-detail">No se pudo acceder a la cámara</div>
                    </div>
                `;
                scanning = false;
                return;
            }

            currentStream = stream;
            currentTrack = stream.getVideoTracks()[0];
            video.srcObject = stream;
            await video.play().catch(() => {});

            // Pedir enfoque continuo si el celu lo permite (mejora enorme de nitidez).
            try {
                const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
                if (caps.focusMode && caps.focusMode.includes('continuous')) {
                    await currentTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                }
            } catch (e) {}

            // 2) Preparar el detector: nativo del celular si existe, si no jsQR liviano.
            detector = null;
            if ('BarcodeDetector' in window) {
                try {
                    const fmts = await BarcodeDetector.getSupportedFormats();
                    if (fmts.includes('qr_code')) {
                        detector = new BarcodeDetector({ formats: ['qr_code'] });
                    }
                } catch (e) {}
            }
            if (!detector) {
                await ensureFallbackDecoder();
            }

            setupTorch();

            scanning = true;
            scanLoop();
        }

        // Carga jsQR SOLO si el celular no tiene BarcodeDetector nativo.
        function ensureFallbackDecoder() {
            if (window.jsQR) return Promise.resolve();
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
                s.onload = resolve;
                s.onerror = resolve; // si falla, seguimos sin romper
                document.head.appendChild(s);
            });
        }

        async function scanLoop() {
            if (!scanning) return;
            const video = document.getElementById('qr-video');

            try {
                if (detector && video.readyState >= 2) {
                    // Camino rápido: hardware del teléfono.
                    const codes = await detector.detect(video);
                    if (codes.length) onScanSuccess(codes[0].rawValue);
                } else if (window.jsQR && video.videoWidth) {
                    // Fallback: bajamos la resolución a 640 para que jsQR vuele.
                    const canvas = document.getElementById('qr-canvas');
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const scale = Math.min(1, 640 / video.videoWidth);
                    const w = Math.round(video.videoWidth * scale);
                    const h = Math.round(video.videoHeight * scale);
                    canvas.width = w; canvas.height = h;
                    ctx.drawImage(video, 0, 0, w, h);
                    const img = ctx.getImageData(0, 0, w, h);
                    const res = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
                    if (res && res.data) onScanSuccess(res.data);
                }
            } catch (e) {}

            // ~12 lecturas/seg: fluido pero sin recalentar el teléfono.
            setTimeout(scanLoop, detector ? 70 : 110);
        }

        function setupTorch() {
            const btn = document.getElementById('torchBtn');
            torchOn = false;
            btn.classList.remove('active');
            try {
                const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
                btn.style.display = caps.torch ? 'block' : 'none';
            } catch (e) {
                btn.style.display = 'none';
            }
        }

        async function toggleTorch() {
            if (!currentTrack) return;
            torchOn = !torchOn;
            try {
                await currentTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
                document.getElementById('torchBtn').classList.toggle('active', torchOn);
            } catch (e) {
                console.warn('No se pudo cambiar la linterna:', e);
            }
        }

        function stopScanner() {
            scanning = false;
            torchOn = false;
            document.getElementById('torchBtn').style.display = 'none';
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }
            currentTrack = null;
            const video = document.getElementById('qr-video');
            if (video) video.srcObject = null;
        }

        let pendingUrl = '';

        function onScanSuccess(decodedText) {
            // Evitar duplicados rápidos (mismo QR en menos de 3 seg)
            const now = Date.now();
            if (decodedText === lastScannedCode && (now - lastScanTime) < 3000) return;
            lastScannedCode = decodedText;
            lastScanTime = now;

            const text = decodedText.trim();

            // El QR de autorización de ML es una URL de handshake.
            if (/^https?:\/\//i.test(text)) {
                pendingUrl = text;
                if (navigator.vibrate) navigator.vibrate(80);
                playBeep(true);
                detenerEscaneo();      // ya tenemos el QR, apagamos la cámara
                pedirCuenta();         // preguntamos MIKRA o CHAYA
            } else {
                mostrarNoAuth();
            }
        }

        // Frena la cámara y resetea el botón (como si tocaras "Detener")
        function detenerEscaneo() {
            stopScanner();
            const btn = document.getElementById('scanBtn');
            btn.textContent = '📷 Escanear QR';
            btn.classList.remove('active');
            document.getElementById('scannerSection').style.display = 'none';
        }

        // Muestra los dos botones de cuenta con su código
        function pedirCuenta() {
            const mikra = authCodes.mikra?.code || '---';
            const chaya = authCodes.chaya?.code || '---';
            document.getElementById('resultArea').innerHTML = `
                <div class="result-card">
                    <div class="account-ask">✅ QR leído — ¿qué cuenta?</div>
                    <button class="account-btn mikra" onclick="usarCuenta('mikra')">
                        <span class="account-name">MIKRA</span>
                        <span class="account-code">${mikra}</span>
                    </button>
                    <button class="account-btn chaya" onclick="usarCuenta('chaya')">
                        <span class="account-name">CHAYA</span>
                        <span class="account-code">${chaya}</span>
                    </button>
                    <div class="account-hint">Copia el código y te lleva a la página para pegarlo</div>
                </div>
            `;
        }

        // Copia el código de la cuenta elegida y abre la página del QR
        async function usarCuenta(cuenta) {
            const code = authCodes[cuenta]?.code || '';

            if (code) {
                try {
                    await navigator.clipboard.writeText(code);
                } catch (e) {
                    copiarFallback(code);
                }
            }

            if (navigator.vibrate) navigator.vibrate(60);

            // Historial
            scanHistory.unshift({ code, match: true, cuenta, time: new Date() });
            if (scanHistory.length > 20) scanHistory.pop();
            renderHistory();

            // Ir a la página de ML para pegar el código
            if (pendingUrl) window.location.href = pendingUrl;
        }

        // Copia sin la API moderna (por si el navegador no la permite)
        function copiarFallback(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            } catch (e) {}
        }

        function mostrarNoAuth() {
            document.getElementById('resultArea').innerHTML = `
                <div class="result-card no-match">
                    <div class="result-icon">⚠️</div>
                    <div class="result-detail">Ese QR no es de autorización de MercadoLibre</div>
                </div>
            `;
        }

        function renderHistory() {
            if (scanHistory.length === 0) return;

            let html = '<div class="history-title">Últimos escaneos</div>';
            scanHistory.forEach(item => {
                const icon = item.match ? '✅' : '❌';
                const cuentaTag = item.cuenta
                    ? `<span class="result-cuenta ${item.cuenta}" style="font-size:9px;padding:2px 6px;">${item.cuenta.toUpperCase()}</span>`
                    : '';
                html += `
                    <div class="history-item ${item.match ? 'match' : 'no-match'}">
                        <div>
                            ${icon} <span class="history-code">${item.code}</span>
                            ${cuentaTag}
                        </div>
                        <div class="history-time">${item.time.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                    </div>
                `;
            });

            document.getElementById('historyArea').innerHTML = html;
        }

        function playBeep(success) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (success) {
                    osc.frequency.value = 880;
                    gain.gain.value = 0.3;
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else {
                    osc.frequency.value = 220;
                    gain.gain.value = 0.3;
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {}
        }

        // Init
        cargarCodigos();

        // Refrescar códigos cada 5 min
        setInterval(cargarCodigos, 5 * 60 * 1000);

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw-qr.js').catch(() => {});
        }
    </script>
</body>
</html>
