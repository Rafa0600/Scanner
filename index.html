<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Auth Codes ML</title>
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Auth ML">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            height: 100vh; height: 100dvh;
            overflow: hidden;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh; height: 100dvh;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* Codes bar */
        .codes-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 10px 10px 6px;
            flex-shrink: 0;
        }
        .code-card {
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 12px;
            padding: 8px 10px;
            position: relative; overflow: hidden;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.15s;
        }
        .code-card:active { transform: scale(0.97); }
        .code-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
        .code-card.mikra::before { background: linear-gradient(90deg, #9C27B0, #E040FB); }
        .code-card.chaya::before { background: linear-gradient(90deg, #FF6B00, #FFB74D); }
        .code-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
        .code-label { font-size:11px; font-weight:700; }
        .code-card.mikra .code-label { color:#E040FB; }
        .code-card.chaya .code-label { color:#FFB74D; }
        .code-time { font-family:'JetBrains Mono',monospace; font-size:8px; color:#444; }
        .code-value { font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:800; color:#fff; letter-spacing:2px; text-align:center; }
        .code-value.missing { font-size:11px; color:#ff5252; letter-spacing:0; }
        .code-hint { text-align:center; font-size:8px; color:#333; }

        /* Scanner */
        .scanner-area { flex:1; padding:0 10px 6px; min-height:0; display:flex; flex-direction:column; }
        .scanner-box {
            flex:1; background:#000; border:1px solid #1e1e2e;
            border-radius:16px; overflow:hidden; position:relative;
            display:flex; align-items:center; justify-content:center;
        }
        #qr-reader { width:100%; height:100%; }
        #qr-reader video { border-radius:14px !important; object-fit:cover !important; }
        #qr-reader__scan_region { min-height:100% !important; }
        #qr-reader__dashboard, #qr-reader__dashboard_section,
        #qr-reader__dashboard_section_csr, #qr-reader__header_message,
        #qr-reader__status_span, #qr-reader img[alt="Info icon"] { display:none !important; }

        .scanner-placeholder { text-align:center; color:#444; padding:40px; }
        .scanner-placeholder .icon { font-size:48px; margin-bottom:10px; }

        /* Result overlay */
        .result-overlay {
            position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
            z-index:10; pointer-events:none; opacity:0; transition:opacity 0.2s;
        }
        .result-overlay.show { opacity:1; }
        .result-bubble {
            padding:16px 28px; border-radius:16px; text-align:center;
            backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        }
        .result-bubble.match { background:rgba(0,230,118,0.9); color:#000; }
        .result-bubble.no-match { background:rgba(255,82,82,0.9); color:#fff; }
        .result-icon { font-size:36px; }
        .result-code { font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:800; margin:4px 0; }
        .result-detail { font-size:12px; font-weight:600; }

        /* History */
        .history-bar { flex-shrink:0; padding:4px 10px 8px; max-height:100px; overflow-y:auto; }
        .history-item {
            display:flex; justify-content:space-between; align-items:center;
            padding:5px 8px; background:#12121a; border-radius:8px; margin-bottom:3px; font-size:11px;
        }
        .history-item.match { border-left:3px solid #00e676; }
        .history-item.no-match { border-left:3px solid #ff5252; }
        .history-code { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px; }
        .history-cuenta {
            display:inline-block; padding:1px 4px; border-radius:4px;
            font-size:7px; font-weight:700; margin-left:3px;
        }
        .history-cuenta.mikra { background:#9C27B0; color:white; }
        .history-cuenta.chaya { background:#FF6B00; color:white; }
        .history-time { font-family:'JetBrains Mono',monospace; font-size:8px; color:#555; }

        /* Toast */
        .toast {
            position:fixed; top:calc(10px + var(--safe-top)); left:50%;
            transform:translateX(-50%) translateY(-60px);
            background:#00a650; color:white; padding:7px 18px; border-radius:10px;
            font-weight:700; font-size:12px; z-index:999; opacity:0; transition:all 0.3s;
            pointer-events:none; font-family:'JetBrains Mono',monospace; white-space:nowrap;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        @keyframes flash-copy {
            0% { background:#12121a; }
            50% { background:#1a2a1a; border-color:#00e676; }
            100% { background:#12121a; border-color:#1e1e2e; }
        }
        .flash { animation: flash-copy 0.4s ease; }
    </style>
</head>
<body>
    <div class="app">
        <div class="codes-bar">
            <div class="code-card mikra" id="cardMikra" onclick="copiar('mikra')">
                <div class="code-top">
                    <div class="code-label">MIKRA</div>
                    <div class="code-time" id="timeMikra"></div>
                </div>
                <div class="code-value" id="codeMikra">---</div>
                <div class="code-hint">tocar = copiar</div>
            </div>
            <div class="code-card chaya" id="cardChaya" onclick="copiar('chaya')">
                <div class="code-top">
                    <div class="code-label">CHAYA</div>
                    <div class="code-time" id="timeChaya"></div>
                </div>
                <div class="code-value" id="codeChaya">---</div>
                <div class="code-hint">tocar = copiar</div>
            </div>
        </div>

        <div class="scanner-area">
            <div class="scanner-box" id="scannerBox">
                <div id="qr-reader"></div>
                <div class="scanner-placeholder" id="scannerPlaceholder">
                    <div class="icon">📷</div>
                    <div style="font-size:13px">Iniciando cámara...</div>
                </div>
                <div class="result-overlay" id="resultOverlay">
                    <div class="result-bubble" id="resultBubble">
                        <div class="result-icon" id="resultIcon"></div>
                        <div class="result-code" id="resultCode"></div>
                        <div class="result-detail" id="resultDetail"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="history-bar" id="historyBar"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const WORKER_URL = 'https://ml-auth-codes.rafaelassir.workers.dev';
        let codes = { mikra: null, chaya: null };
        let scanner = null;
        let scanHistory = [];
        let lastScannedCode = '';
        let lastScanTime = 0;

        async function cargarCodigos() {
            try {
                const resp = await fetch(`${WORKER_URL}/get-all`);
                const data = await resp.json();
                codes = data;

                if (data.mikra?.code) {
                    document.getElementById('codeMikra').textContent = data.mikra.code;
                    document.getElementById('codeMikra').className = 'code-value';
                    document.getElementById('timeMikra').textContent = formatTime(data.mikra.updated);
                } else {
                    document.getElementById('codeMikra').textContent = 'Sin código';
                    document.getElementById('codeMikra').className = 'code-value missing';
                }

                if (data.chaya?.code) {
                    document.getElementById('codeChaya').textContent = data.chaya.code;
                    document.getElementById('codeChaya').className = 'code-value';
                    document.getElementById('timeChaya').textContent = formatTime(data.chaya.updated);
                } else {
                    document.getElementById('codeChaya').textContent = 'Sin código';
                    document.getElementById('codeChaya').className = 'code-value missing';
                }

                // Auto-copy: Chaya first, then Mikra (Mikra stays in clipboard)
                try {
                    if (data.chaya?.code) {
                        await navigator.clipboard.writeText(data.chaya.code);
                        flashCard('cardChaya');
                    }
                    await new Promise(r => setTimeout(r, 300));
                    if (data.mikra?.code) {
                        await navigator.clipboard.writeText(data.mikra.code);
                        flashCard('cardMikra');
                        showToast('📋 MIKRA copiado');
                    }
                } catch(e) {}
            } catch (e) {
                console.error('Error:', e);
            }
        }

        async function copiar(cuenta) {
            const code = codes[cuenta]?.code;
            if (!code) return;
            try {
                await navigator.clipboard.writeText(code);
                flashCard(cuenta === 'mikra' ? 'cardMikra' : 'cardChaya');
                showToast(`📋 ${cuenta.toUpperCase()}: ${code}`);
            } catch(e) {}
        }

        async function initScanner() {
            try {
                scanner = new Html5Qrcode("qr-reader");
                const box = document.getElementById('scannerBox');
                const w = box.clientWidth;
                const h = box.clientHeight;
                const qrSize = Math.min(w, h, 280) - 40;

                await scanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: qrSize, height: qrSize }, disableFlip: false },
                    onScanSuccess,
                    () => {}
                );
                document.getElementById('scannerPlaceholder').style.display = 'none';
            } catch (err) {
                document.getElementById('scannerPlaceholder').innerHTML =
                    `<div class="icon">📵</div><div style="font-size:12px;color:#ff5252">No se pudo abrir la cámara</div>`;
            }
        }

        function onScanSuccess(text) {
            const now = Date.now();
            if (text === lastScannedCode && (now - lastScanTime) < 3000) return;
            lastScannedCode = text;
            lastScanTime = now;
            verificarCodigo(text.trim().toUpperCase());
        }

        function verificarCodigo(code) {
            const mk = (codes.mikra?.code || '').toUpperCase();
            const ch = (codes.chaya?.code || '').toUpperCase();
            let match = false, cuenta = '';
            if (code === mk) { match = true; cuenta = 'mikra'; }
            else if (code === ch) { match = true; cuenta = 'chaya'; }

            if (navigator.vibrate) navigator.vibrate(match ? [100] : [80, 40, 80, 40, 80]);
            playBeep(match);

            const overlay = document.getElementById('resultOverlay');
            document.getElementById('resultIcon').textContent = match ? '✅' : '❌';
            document.getElementById('resultCode').textContent = code;
            document.getElementById('resultDetail').textContent = match ? `${cuenta.toUpperCase()} — Válido` : 'No coincide';
            document.getElementById('resultBubble').className = `result-bubble ${match ? 'match' : 'no-match'}`;
            overlay.classList.add('show');
            setTimeout(() => overlay.classList.remove('show'), 1800);

            scanHistory.unshift({ code, match, cuenta, time: new Date() });
            if (scanHistory.length > 10) scanHistory.pop();
            renderHistory();
        }

        function renderHistory() {
            const el = document.getElementById('historyBar');
            if (!scanHistory.length) return;
            el.innerHTML = scanHistory.map(h => {
                const ct = h.cuenta ? `<span class="history-cuenta ${h.cuenta}">${h.cuenta.toUpperCase()}</span>` : '';
                return `<div class="history-item ${h.match?'match':'no-match'}">
                    <div>${h.match?'✅':'❌'} <span class="history-code">${h.code}</span>${ct}</div>
                    <div class="history-time">${h.time.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div>
                </div>`;
            }).join('');
        }

        function flashCard(id) {
            const el = document.getElementById(id);
            el.classList.remove('flash');
            void el.offsetWidth;
            el.classList.add('flash');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso), min = Math.floor((Date.now() - d) / 60000);
            if (min < 1) return 'recién';
            if (min < 60) return `${min}min`;
            const h = Math.floor(min / 60);
            if (h < 24) return `${h}h`;
            return d.toLocaleDateString('es-AR');
        }

        function playBeep(ok) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                g.gain.value = 0.3; o.frequency.value = ok ? 880 : 220;
                o.start(); o.stop(ctx.currentTime + (ok ? 0.15 : 0.4));
            } catch(e) {}
        }

        // Init
        cargarCodigos();
        setTimeout(initScanner, 500);
        setInterval(cargarCodigos, 5 * 60 * 1000);

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
</body>
</html>
