<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>QR Scanner - Auth Codes</title>
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QR Auth">
    <link rel="manifest" href="manifest-qr.json">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 16px; }

        h1 { font-size: 20px; font-weight: 900; text-align: center; margin-bottom: 16px; letter-spacing: -0.5px; }
        h1 span { color: #FFE600; }

        /* Auth codes display */
        .codes-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .code-card {
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .code-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }
        .code-card.mikra::before { background: linear-gradient(90deg, #9C27B0, #E040FB); }
        .code-card.chaya::before { background: linear-gradient(90deg, #FF6B00, #FFB74D); }

        .code-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .code-card.mikra .code-label { color: #E040FB; }
        .code-card.chaya .code-label { color: #FFB74D; }

        .code-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
        }

        .code-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: #444;
            margin-top: 4px;
        }

        .code-missing {
            font-size: 12px;
            color: #ff5252;
        }

        /* Scanner */
        .scanner-section {
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        #qr-reader {
            width: 100%;
        }
        #qr-reader video { border-radius: 12px; }
        /* Hide the ugly default UI */
        #qr-reader__scan_region { min-height: 200px !important; }
        #qr-reader__dashboard { padding: 8px !important; }
        #qr-reader__dashboard_section { display: none !important; }
        #qr-reader__dashboard_section_csr { display: none !important; }
        #qr-reader img[alt="Info icon"] { display: none !important; }
        #qr-reader__header_message { display: none !important; }
        #qr-reader__status_span { display: none !important; }

        .scan-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3483FA, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .scan-btn:hover { transform: scale(1.02); }
        .scan-btn.active { background: linear-gradient(135deg, #ff5252, #d32f2f); }

        /* Result */
        .result-card {
            background: #12121a;
            border: 2px solid #1e1e2e;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 12px;
            transition: all 0.3s;
        }
        .result-card.match {
            border-color: #00e676;
            background: #0a1a0f;
        }
        .result-card.no-match {
            border-color: #ff5252;
            background: #1a0a0a;
        }

        .result-icon { font-size: 48px; margin-bottom: 8px; }

        .result-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .result-card.match .result-code { color: #00e676; }
        .result-card.no-match .result-code { color: #ff5252; }

        .result-detail {
            font-size: 13px;
            color: #888;
        }
        .result-card.match .result-detail { color: #66bb6a; }
        .result-card.no-match .result-detail { color: #ef9a9a; }

        .result-cuenta {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 8px;
        }
        .result-cuenta.mikra { background: #9C27B0; color: white; }
        .result-cuenta.chaya { background: #FF6B00; color: white; }

        /* History */
        .history-title {
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #12121a;
            border: 1px solid #1e1e2e;
            border-radius: 10px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .history-item.match { border-left: 3px solid #00e676; }
        .history-item.no-match { border-left: 3px solid #ff5252; }

        .history-code {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }
        .history-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #555;
        }

        .reload-codes {
            background: none;
            border: 1px solid #333;
            color: #888;
            padding: 6px 14px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reload-codes:hover { border-color: #FFE600; color: #FFE600; }

        @keyframes flash-green {
            0%, 100% { background: #0a1a0f; }
            50% { background: #1a3a1f; }
        }
        @keyframes flash-red {
            0%, 100% { background: #1a0a0a; }
            50% { background: #3a1a1a; }
        }
        .flash-ok { animation: flash-green 0.3s ease 3; }
        .flash-fail { animation: flash-red 0.3s ease 3; }

        /* Sound feedback hidden elements */
        .beep-ok, .beep-fail { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 <span>QR Scanner</span></h1>

        <div class="codes-row">
            <div class="code-card mikra">
                <div class="code-label">MIKRA</div>
                <div class="code-value" id="codeMikra">---</div>
                <div class="code-time" id="timeMikra"></div>
            </div>
            <div class="code-card chaya">
                <div class="code-label">CHAYA</div>
                <div class="code-value" id="codeChaya">---</div>
                <div class="code-time" id="timeChaya"></div>
            </div>
        </div>

        <div style="text-align:center; margin-bottom:12px;">
            <button class="reload-codes" onclick="cargarCodigos()">⟳ Actualizar códigos</button>
        </div>

        <button class="scan-btn" id="scanBtn" onclick="toggleScanner()">📷 Escanear QR</button>

        <div class="scanner-section" id="scannerSection" style="display:none;">
            <div id="qr-reader"></div>
        </div>

        <div id="resultArea"></div>

        <div id="historyArea"></div>
    </div>

    <script>
        const WORKER_URL = 'https://ml-auth-codes.rafaelassir.workers.dev';

        let authCodes = { mikra: null, chaya: null };
        let scanner = null;
        let scanning = false;
        let scanHistory = [];
        let lastScannedCode = '';
        let lastScanTime = 0;

        // Cargar códigos del worker
        async function cargarCodigos() {
            try {
                const resp = await fetch(`${WORKER_URL}/get-all`);
                const data = await resp.json();
                authCodes = data;

                // Mikra
                if (data.mikra?.code) {
                    document.getElementById('codeMikra').textContent = data.mikra.code;
                    document.getElementById('timeMikra').textContent = formatTime(data.mikra.updated);
                } else {
                    document.getElementById('codeMikra').innerHTML = '<span class="code-missing">Sin código</span>';
                    document.getElementById('timeMikra').textContent = '';
                }

                // Chaya
                if (data.chaya?.code) {
                    document.getElementById('codeChaya').textContent = data.chaya.code;
                    document.getElementById('timeChaya').textContent = formatTime(data.chaya.updated);
                } else {
                    document.getElementById('codeChaya').innerHTML = '<span class="code-missing">Sin código</span>';
                    document.getElementById('timeChaya').textContent = '';
                }
            } catch (e) {
                console.error('Error cargando códigos:', e);
                document.getElementById('codeMikra').innerHTML = '<span class="code-missing">Error</span>';
                document.getElementById('codeChaya').innerHTML = '<span class="code-missing">Error</span>';
            }
        }

        function formatTime(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            const now = new Date();
            const diffMin = Math.floor((now - d) / 60000);
            if (diffMin < 1) return 'recién';
            if (diffMin < 60) return `hace ${diffMin}min`;
            const diffH = Math.floor(diffMin / 60);
            if (diffH < 24) return `hace ${diffH}h`;
            return d.toLocaleDateString('es-AR');
        }

        // Scanner
        async function toggleScanner() {
            const btn = document.getElementById('scanBtn');
            const section = document.getElementById('scannerSection');

            if (scanning) {
                stopScanner();
                btn.textContent = '📷 Escanear QR';
                btn.classList.remove('active');
                section.style.display = 'none';
            } else {
                section.style.display = 'block';
                btn.textContent = '⏹ Detener';
                btn.classList.add('active');
                startScanner();
            }
        }

        async function startScanner() {
            scanning = true;

            scanner = new Html5Qrcode("qr-reader");

            try {
                await scanner.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: { width: 250, height: 250 },
                        aspectRatio: 1
                    },
                    onScanSuccess,
                    () => {} // ignore errors
                );
            } catch (err) {
                console.error("Error iniciando cámara:", err);
                document.getElementById('resultArea').innerHTML = `
                    <div class="result-card no-match">
                        <div class="result-icon">📵</div>
                        <div class="result-detail">No se pudo acceder a la cámara</div>
                    </div>
                `;
                scanning = false;
            }
        }

        function stopScanner() {
            scanning = false;
            if (scanner) {
                scanner.stop().catch(() => {});
                scanner = null;
            }
        }

        function onScanSuccess(decodedText) {
            // Evitar duplicados rápidos (mismo código en menos de 3 seg)
            const now = Date.now();
            if (decodedText === lastScannedCode && (now - lastScanTime) < 3000) return;
            lastScannedCode = decodedText;
            lastScanTime = now;

            const code = decodedText.trim().toUpperCase();
            verificarCodigo(code);
        }

        function verificarCodigo(code) {
            const mikraCode = authCodes.mikra?.code?.toUpperCase() || '';
            const chayaCode = authCodes.chaya?.code?.toUpperCase() || '';

            let match = false;
            let cuenta = '';

            if (code === mikraCode) {
                match = true;
                cuenta = 'mikra';
            } else if (code === chayaCode) {
                match = true;
                cuenta = 'chaya';
            }

            // Vibrar
            if (navigator.vibrate) {
                navigator.vibrate(match ? [100] : [100, 50, 100, 50, 100]);
            }

            // Beep
            playBeep(match);

            // Resultado visual
            const resultArea = document.getElementById('resultArea');
            const cuentaLabel = cuenta === 'mikra' ? 'MIKRA' : cuenta === 'chaya' ? 'CHAYA' : '';

            resultArea.innerHTML = `
                <div class="result-card ${match ? 'match flash-ok' : 'no-match flash-fail'}">
                    <div class="result-icon">${match ? '✅' : '❌'}</div>
                    <div class="result-code">${code}</div>
                    <div class="result-detail">${match ? 'Código válido' : 'No coincide con ninguna cuenta'}</div>
                    ${cuenta ? `<span class="result-cuenta ${cuenta}">${cuentaLabel}</span>` : ''}
                </div>
            `;

            // Historial
            scanHistory.unshift({
                code,
                match,
                cuenta,
                time: new Date()
            });
            if (scanHistory.length > 20) scanHistory.pop();
            renderHistory();
        }

        function renderHistory() {
            if (scanHistory.length === 0) return;

            let html = '<div class="history-title">Últimos escaneos</div>';
            scanHistory.forEach(item => {
                const icon = item.match ? '✅' : '❌';
                const cuentaTag = item.cuenta
                    ? `<span class="result-cuenta ${item.cuenta}" style="font-size:9px;padding:2px 6px;">${item.cuenta.toUpperCase()}</span>`
                    : '';
                html += `
                    <div class="history-item ${item.match ? 'match' : 'no-match'}">
                        <div>
                            ${icon} <span class="history-code">${item.code}</span>
                            ${cuentaTag}
                        </div>
                        <div class="history-time">${item.time.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                    </div>
                `;
            });

            document.getElementById('historyArea').innerHTML = html;
        }

        function playBeep(success) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (success) {
                    osc.frequency.value = 880;
                    gain.gain.value = 0.3;
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else {
                    osc.frequency.value = 220;
                    gain.gain.value = 0.3;
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {}
        }

        // También permitir input manual
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const input = prompt('Ingresá el código manualmente:');
                if (input) verificarCodigo(input.trim().toUpperCase());
            }
        });

        // Init
        cargarCodigos();

        // Refrescar códigos cada 5 min
        setInterval(cargarCodigos, 5 * 60 * 1000);

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw-qr.js').catch(() => {});
        }
    </script>
</body>
</html>
